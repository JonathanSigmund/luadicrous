[package]
name = "luau-lifter"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
luadicrous-bytecode = { path = "../crates/luadicrous-bytecode" }
num_enum = "0.5.6"
nom = "7.1.0"
nom-leb128 = "0.2.0"
anyhow = { version = "1.0.53", features = ["backtrace"] }
cfg = { path = "../cfg" }
ast = { path = "../ast" }
rustc-hash = "1.1.0"
dhat = "0.3.1"
either = "1.6.1"
petgraph.workspace = true
restructure = { path = "../restructure" }
lazy_static = "1.4.0"
itertools = "0.10.5"
indexmap = "1.9.1"
by_address = "1.1.0"
triomphe = "0.1.8"
parking_lot = "0.12.1"

[features]
dhat-heap = []
panic-handled = []
