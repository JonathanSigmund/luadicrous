name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test and build
        run: |
          cargo test --release --workspace --locked --target '${{ matrix.target }}'
          cargo build --release --locked --target '${{ matrix.target }}' -p luadicrous-cli -p luadicrous-server
      - name: Package binaries and provenance
        run: |
          package="luadicrous-${{ matrix.target }}"
          mkdir "$package"
          cp 'target/${{ matrix.target }}/release/luadicrous-rs${{ matrix.suffix }}' "$package/"
          cp 'target/${{ matrix.target }}/release/luadicrous-server${{ matrix.suffix }}' "$package/"
          cp LICENSE.txt README.md CHANGELOG.md "$package/"
          printf '%s\n' "$GITHUB_SHA" > "$package/COMMIT"
          tar -czf "$package.tar.gz" "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: luadicrous-${{ matrix.target }}
          path: luadicrous-*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --prerelease
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
